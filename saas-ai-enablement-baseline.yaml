    Verify actual feature failure behavior. Restrict or disable unsupported functionality rather than inventing a
    fail-closed vendor toggle.
  required_settings_json: '{"required_protection_failure_behavior": "block_or_safe_non_ai_fallback", "silent_unguarded_fallback_allowed":
    false}'
  evidence_required_json: '["Timeout/outage tests and vendor evidence for the required protection boundary."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Guardrail or authorization failure falls back to an unprotected model route.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-RAG-001
  name: Approved retrieval sources and ingestion
  domain: Retrieval and knowledge security
  severity: high
