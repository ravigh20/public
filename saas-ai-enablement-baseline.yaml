- id: SAAS-AI-002
  name: Direct and indirect prompt-injection resistance
  domain: AI security
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Treat prompts, documents, email, tickets, tool results and retrieved content as untrusted; do not let model instructions
    grant authority.
  implementation: >-
    Combine available detection with deterministic authorization, destination restrictions and human approval. Include
    multi-turn and cross-agent negative tests.
  required_settings_json: '{"untrusted_content_treated_as_data": true, "llm_text_can_override_authorization": false}'
  evidence_required_json: '["Injection test plan and results across all in-scope input and retrieval surfaces."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A malicious knowledge article causes a tool invocation or data disclosure beyond the user entitlement.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-003
  name: Safe output handling and downstream consumption
  domain: AI security
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Treat generated content as untrusted before rendering, execution or downstream business use.
  implementation: >-
    Encode HTML/Markdown, validate links and file types and review generated code/queries. Never automatically execute
    model output as code or instructions.
  required_settings_json: '{"model_output_auto_execution_allowed": false, "generated_content_sanitized": true}'
  evidence_required_json: '["Output rendering/escaping tests and downstream input-validation controls."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A generated link, HTML fragment or query executes outside the intended operation.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-004
  name: Grounding integrity and human verification
  domain: AI security
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Use approved sources and verify material AI claims before acting; citations must not disclose unauthorized source
    metadata.
  implementation: >-
    Require evidence-aware review for high-impact outputs, handle uncertainty and route unsupported requests to a
    safe human/non-AI fallback.
  required_settings_json: '{"material_ai_output_human_review_required": true, "unverified_ai_output_treated_as_authoritative":
    false}'
  evidence_required_json: '["Source fidelity tests, hallucination/error handling and business review procedure."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A fabricated statement becomes an externally communicated fact or automated business decision.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-005
  name: Prompt and configuration secrecy boundaries
  domain: AI security
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Keep credentials and confidential authorization rules out of prompts; leaked system instructions must not defeat
    access control.
  implementation: >-
    Restrict prompt editing and exports, version templates and keep enforcement in deterministic policy rather than
    hidden text.
  required_settings_json: '{"secrets_in_prompts_allowed": false, "prompt_text_used_as_access_control": false}'
  evidence_required_json: '["Redacted prompt review, editor permissions and prompt-extraction impact assessment."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Disclosure of a system prompt reveals a secret or enables privileged actions.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-006
  name: Agent tool minimization and explicit authority
  domain: Agent and action security
  severity: critical
  responsibility: shared
  applies_when_json: '["agents"]'
  requirement: >-
    Enable only task-required agents and tools with individually scoped permissions; disable unreviewed discovery
    and collaboration.
  implementation: >-
    Maintain a tool/agent registry and approved dependencies; enforce authorization at the tool/resource boundary
    rather than relying on topic instructions.
  required_settings_json: '{"agent_tools_allowlisted": true, "unreviewed_agent_collaboration_enabled": false}'
  evidence_required_json: '["Agent/tool inventory, effective scopes and rejected out-of-scope tool selection."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An agent discovers or calls a high-privilege agent/tool that was not reviewed.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-007
  name: Per-action authorization and secure writeback
  domain: Agent and action security
  severity: critical
  responsibility: shared
  applies_when_json: '["write_actions"]'
  requirement: >-
    Authorize the exact target, operation and parameters immediately before each AI-initiated business action.
  implementation: >-
    Separate read and write identities where practical; bind approvals to immutable action details and reauthorize
    after context changes.
  required_settings_json: '{"per_action_authorization_required": true, "unchecked_ai_writeback_allowed": false}'
  evidence_required_json: '["Denied-record/action tests and parameter-bound authorization design."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A valid approval for one target is reused to change another customer record.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-AI-008
  name: Human confirmation for business effects
  domain: Agent and action security
  severity: critical
  responsibility: shared
  applies_when_json: '["write_actions"]'
  requirement: >-
    Require a trusted human gate before business-impacting actions, external communications and privileged operations
    in this baseline.
  implementation: >-
    Present target, effect and data to the approver; avoid model-controlled approval paths and unattended consent
    bypass.
  required_settings_json: '{"human_confirmation_before_side_effects": true, "agent_can_approve_own_action": false}'
  evidence_required_json: '["Supervised action test showing rejection, timeout and modified-parameter handling."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A tool executes before the human decision or treats model text as approval.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-AI-009
  name: Bounded execution and recovery
  domain: Agent and action security
  severity: high
  responsibility: shared
  applies_when_json: '["agents"]'
  requirement: >-
    Bound agent loops, time, tools, concurrent runs and consumption; define cancellation and recoverable side effects.
  implementation: >-
    Set approved budgets and stop conditions, detect repeated actions and provide compensating operations for safe
    rollback.
  required_settings_json: '{"agent_execution_limits_defined": true, "unbounded_agent_loops_allowed": false, "action_recovery_plan_defined":
    true}'
  evidence_required_json: '["Budget settings and cancellation/retry/partial-failure tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A failed tool causes an unbounded retry loop or duplicate business transactions.
  supports_baseline_json: '[]'
  source_refs_json: '["OWASP-LLM"]'
- id: SAAS-AI-010
  name: Conversation memory and learning governance
  domain: Agent and action security
  severity: high
  responsibility: shared
  applies_when_json: '["agents"]'
  requirement: >-
    Do not enable unreviewed persistent memory, experience learning or cross-user context reuse.
  implementation: >-
    Document memory ownership, access, lifetime, poisoning defenses and deletion. Keep personalization and shared-model
    training decisions separate.
  required_settings_json: '{"unreviewed_persistent_memory_enabled": false, "memory_access_and_deletion_defined": true}'
  evidence_required_json: '["Memory/learning settings, storage scope and cross-user/deletion tests."]'
