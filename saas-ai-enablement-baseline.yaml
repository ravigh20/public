  source_refs_json: '[]'
- id: SAAS-AI-011
  name: Safe failure of required safeguards
  domain: AI security
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Do not silently continue the protected operation when a mandatory authorization, privacy or safety safeguard is
