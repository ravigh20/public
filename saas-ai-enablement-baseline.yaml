# TABLE-EDITOR FORMAT: top-level array; one security control per row.
# Policy: ABC-SAAS-AI-ENABLEMENT-BASELINE | version: 1.1 | status: draft
# Inherits: none (shared baseline); mode: additive_only
# Keep policy-metadata.json with these files for inheritance, features, scope and sources.
# *_json columns contain quoted JSON text; true/false inside JSON retain their Boolean types.
# Only the representation changed. Security requirements and evidence remain unmodified.

- id: SAAS-GOV-001
  name: Feature-specific authorization boundary
  domain: Governance
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Authorize a named AI feature, tenant, release, user population, purpose and data boundary; do not enable a whole
    product family by association.
  implementation: >-
    Record feature/SKU, environment, region, channels, provider routes, dependencies, capabilities, pilot size and
    accountable roles before enablement.
  required_settings_json: '{"feature_inventory_complete": true, "unreviewed_ai_features_enabled": false}'
  evidence_required_json: '["Feature inventory, bounded intake and approved change scope; record unknown SKUs/providers
    as gaps."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An additional generative feature is enabled without being included in the reviewed inventory.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-GOV-002
  name: End-to-end security ownership and endorsement
  domain: Governance
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    AI Security owns the full security assessment; Security Authority endorses the bounded assessment without repeating
    its technical review.
  implementation: >-
    Name application, tenant, data, operations and AI Security owners. Keep residual-risk acceptance and privacy/legal/model-risk/release
    approvals with the authorized roles.
  required_settings_json: '{}'
  evidence_required_json: '["Assessment ownership matrix, signed assessment reference, bounded SA endorsement and
    separate domain approvals where required."]'
  validation_mode: manual_evidence
  negative_scenario: >-
    A tenant administrator marks the YAML approved without an authorized assessment or endorsement.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-GOV-003
  name: Reuse existing assurance without hidden gaps
  domain: Governance
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Reuse current SaaS assurance only for unchanged, covered controls; assess every AI-specific or changed exposure.
  implementation: >-
    Map inherited platform evidence by control, feature, tenant, scope and date. Reopen stale evidence and anything
    not covered by existing approval.
  required_settings_json: '{}'
  evidence_required_json: '["Inheritance matrix and delta assessment with explicit vendor/customer/shared responsibility."]'
  validation_mode: manual_evidence
  negative_scenario: >-
    A general SaaS approval is used as the sole approval for a new model provider or AI action.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-GOV-004
  name: Controlled rollout and separation of environments
  domain: Governance
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Validate in a segregated test environment and restrict production rollout to approved groups; separate development
    and production permissions.
  implementation: >-
    Use synthetic or approved sanitized test data, peer-reviewed changes and a staged activation plan with rollback
    criteria.
  required_settings_json: '{"staged_rollout_required": true, "production_data_in_unapproved_test_tenants": false}'
  evidence_required_json: '["Pilot plan, test-tenant access review, rollout group membership and rollback criteria."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Production customer records are copied into an AI trial tenant.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-GOV-005
  name: Version-bound decisions and exceptions
  domain: Governance
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Mandatory unknowns and unsupported safeguards block enablement; exceptions require an authorized, scoped and expiring
    decision, never a silent waiver.
  implementation: >-
    Bind the assessment to feature, model route, connector permissions, policies and versions. Reassess changes; a
    local status field is not a trusted signature.
  required_settings_json: '{}'
  evidence_required_json: '["Decision register, exception owner/expiry/compensating evidence and material-change review
    history."]'
  validation_mode: manual_evidence
  negative_scenario: >-
    A feature proceeds with unknown retention or an expired exception.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-GOV-006
  name: Human accountability and acceptable use
  domain: Governance
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Keep humans accountable for generated advice and business outcomes; do not silently expand into regulated decision-making.
  implementation: >-
    Train users, label AI content where relevant and require authorized human review before business actions or external
    publication. Route high-impact use to relevant governance owners.
  required_settings_json: '{"autonomous_high_impact_decisions_enabled": false, "human_review_before_business_action":
    true}'
  evidence_required_json: '["Acceptable-use guidance, user training and documented review points for the intended
    business process."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Generated financial/customer advice is acted on or sent externally without the required human review.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-001
  name: Enterprise sign-in and MFA
  domain: Identity and access
  severity: critical
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Use enterprise federation and risk-appropriate MFA for human AI access, including privileged operators.
  implementation: >-
    Apply the existing approved IdP and conditional access. Constrain and monitor documented break-glass accounts;
    test alternate sign-in and API channels.
  required_settings_json: '{"enterprise_sso_enforced": true, "human_mfa_required": true, "unmanaged_local_ai_accounts_allowed":
    false}'
  evidence_required_json: '["SSO/MFA policy and denied-access tests for non-entitled users and alternate sign-in paths."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An unmanaged local account accesses the enabled AI feature.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-002
  name: AI entitlements and least privilege
  domain: Identity and access
  severity: critical
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Grant AI access only to approved roles and groups; remove broad inherited permissions that expose unnecessary
    data or administration.
  implementation: >-
    Separate users, builders, connector owners and tenant administrators; review direct assignments and privilege-bearing
    permission bundles.
  required_settings_json: '{"ai_entitlements_restricted": true, "ai_runtime_admin_privileges": false}'
  evidence_required_json: '["Feature role/permission-set export and positive/negative access tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A general employee can edit prompts, add connectors or grant AI permissions.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-003
  name: Joiner/mover/leaver and access recertification
  domain: Identity and access
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Revoke AI entitlements, delegated sessions and service credentials when access changes; periodically recertify
    access.
  implementation: >-
    Connect approved provisioning/deprovisioning processes and inventory nonhuman identities, direct grants and cached
    authorizations.
  required_settings_json: '{"ai_deprovisioning_includes_tokens": true, "ai_access_recertification_required": true}'
  evidence_required_json: '["Leaver test showing feature, session, connector and cached access revocation; access
    review schedule."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A removed user can still retrieve AI-grounded records using a previously issued token.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-004
  name: Privileged administration and separation of duties
  domain: Identity and access
  severity: high
  responsibility: customer
  applies_when_json: '["always"]'
  requirement: >-
    Restrict AI policy, logging, privacy, model and connector administration and require independent review of security-significant
    changes.
  implementation: >-
    Use time-limited privileged access where available; otherwise document an approved equivalent with monitoring
    and revocation. Separate approvers from implementers.
  required_settings_json: '{"security_changes_peer_reviewed": true, "privileged_ai_changes_audited": true}'
  evidence_required_json: '["Admin role inventory, privileged-access procedure and sample reviewed configuration change."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A builder disables protection and approves their own exception.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-005
  name: Sessions, devices and untrusted channels
  domain: Identity and access
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Constrain sessions and access channels to the approved device, network and user risk policy.
  implementation: >-
    Review session lifetime/revocation, browser/mobile/desktop channels and DLP. Treat voice, screen capture and attachments
    as additional data routes.
  required_settings_json: '{"session_controls_defined": true, "unapproved_ai_channels_enabled": false}'
  evidence_required_json: '["Session/channel settings, unmanaged-device decision and session-revocation test."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An unapproved mobile or browser extension route bypasses the reviewed access boundary.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-IAM-006
  name: Nonhuman identities and delegation
  domain: Identity and access
  severity: critical
  responsibility: shared
  applies_when_json: '["agents", "external_connectors", "write_actions"]'
  requirement: >-
    Use scoped service identities and validate the actual identity and authority at each delegated invocation.
  implementation: >-
    Inventory agents, scheduled jobs and integration accounts. Do not equate the initiating user with the principal
    executing downstream reads or writes.
  required_settings_json: '{"execution_principals_inventoried": true, "unreviewed_privilege_delegation_allowed": false}'
  evidence_required_json: '["Execution-identity matrix, service identity grants and a low-privilege-to-high-privilege
    denial test."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A low-privilege user invokes a powerful service account through an AI tool.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-001
  name: Data classification and allowed scope
  domain: Data protection
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Allow only explicitly approved data classifications; the conservative ABC starter prohibits PII, SI and HSI in
    AI inputs and outputs.
  implementation: >-
    Inventory prompts, grounding, attachments, generated outputs, memory and logs. Do not assume existing SaaS data
    approval permits new AI processing. Change this draft restriction only through reviewed policy change.
  required_settings_json: '{"prohibited_ai_data_classes": ["PII", "SI", "HSI"], "unclassified_ai_data_allowed": false}'
  evidence_required_json: '["Data-flow classification, data-owner decision and test records for prohibited classes."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A source with prohibited data is added because it was already stored in the SaaS platform.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-002
  name: Data minimization and field selection
  domain: Data protection
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Send only the records, fields, history and context necessary for the feature.
  implementation: >-
    Use explicit source/field allowlists and bounded history. Exclude secrets, confidential attachments and unrelated
    records before inference.
  required_settings_json: '{"grounding_fields_allowlisted": true, "unbounded_history_sent_to_model": false}'
  evidence_required_json: '["Prompt/grounding field map and sanitized request examples."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Summarization sends an entire record history when only an approved description field is needed.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-003
  name: Record, field and source permission preservation
  domain: Data protection
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Enforce source authorization on retrieval and actions under the effective execution identity; AI must not broaden
    a user entitlement.
  implementation: >-
    Test object/table, field, record/document, tenant/domain and attachment boundaries including indirect retrieval
    paths and caches.
  required_settings_json: '{"source_authorization_preserved": true, "cross_user_data_access_allowed": false}'
  evidence_required_json: '["Two-user denied-record/field tests covering search, summaries, citations and API/tool
    paths."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A summary or citation exposes a field or record the user cannot otherwise read.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-004
  name: Sensitive-content prevention before processing
  domain: Data protection
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Prevent prohibited content reaching disallowed model, logging, feedback or export routes; masking alone is not
    authorization.
  implementation: >-
    Verify feature-specific DLP/masking coverage and ordering. Block or exclude unsupported fields/routes and validate
    both requests and outputs with representative test data.
  required_settings_json: '{"sensitive_content_controls_cover_selected_routes": true, "masking_assumed_from_platform_brand":
    false}'
  evidence_required_json: '["Per-route masking/DLP configuration, detection tests and documented coverage gaps."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A custom action bypasses the masking applied to a standard prompt.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-005
  name: Encryption across the complete AI data path
  domain: Cryptography and secrets
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Protect data in transit and at rest across tenant, inference, logs, embeddings, caches, backups and integrations.
  implementation: >-
    Use approved TLS and certificate validation; obtain vendor evidence for backend storage and internal model routes
    rather than assuming UI TLS covers all hops.
  required_settings_json: '{"tls_certificate_validation_required": true, "plaintext_ai_integrations_allowed": false}'
  evidence_required_json: '["Endpoint tests and feature-scoped vendor encryption/storage evidence."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    The user interface is encrypted but an integration or diagnostic store carries plaintext sensitive data.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-006
  name: Key management and cryptographic coverage
  domain: Cryptography and secrets
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Document key ownership, rotation, revocation and coverage limits for all AI-related stores.
  implementation: >-
    Assess vendor-managed keys and customer-managed keys where required by policy. Do not assume a premium encryption
    feature covers inference, indexes or prompts in memory.
  required_settings_json: '{}'
  evidence_required_json: '["Encryption coverage map, key-management evidence and customer-managed-key support/limitation
    decision."]'
  validation_mode: manual_evidence
  negative_scenario: >-
    A key-management claim applies only to core records while AI transcripts are stored outside its scope.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-007
  name: No training or secondary reuse
  domain: Data lifecycle and privacy
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Do not permit customer prompts, outputs, grounding, feedback or logs to train shared models or improve vendor
    products under this proposed baseline.
  implementation: >-
    Verify contractual terms and effective tenant opt-out for each provider, environment and feedback program. Review
    tenant-specific learning separately; no fine-tuning is authorized here.
  required_settings_json: '{"provider_training_on_customer_content": false, "product_improvement_data_sharing": false,
    "unreviewed_feedback_learning_enabled": false}'
  evidence_required_json: '["Feature/provider contractual terms, effective opt-out confirmations and feedback configuration."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Inference training is disabled but feedback or product-improvement sharing remains enabled.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-008
  name: Separate model-provider retention from SaaS storage
  domain: Data lifecycle and privacy
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Use no content retention by third-party model providers for the approved route; assess SaaS conversation, audit
    and diagnostic storage independently.
  implementation: >-
    Obtain route-specific retention commitments and enumerate abuse monitoring, support, fallback and debug exceptions.
    Unsupported terms are a blocking gap, not assumed zero retention.
  required_settings_json: '{"third_party_model_content_retention": "none", "retention_claim_scope_documented": true}'
  evidence_required_json: '["Provider commitments plus a separate SaaS store-by-store retention schedule."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A third-party zero-retention claim is used to declare that the SaaS keeps no conversations or audit content.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-009
  name: Purpose-bound content and audit retention
  domain: Data lifecycle and privacy
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Minimize content storage and apply approved retention, access restrictions and legal-hold handling to necessary
    records.
  implementation: >-
    Disable optional raw content/debug logging. For mandatory vendor-held logs, determine content, location, access
    and deletion support and obtain a scoped decision before enablement.
  required_settings_json: '{"optional_raw_content_logging_enabled": false, "retention_and_legal_hold_schedule_defined":
    true}'
  evidence_required_json: '["Storage inventory including histories, prompts, responses, traces, feedback and incident
    evidence."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    AI traces retain full prompts indefinitely outside the approved records schedule.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-010
  name: Processing location and cross-border routes
  domain: Data lifecycle and privacy
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Restrict storage and processing to approved jurisdictions, including inference, overflow, disaster recovery, support
    and subprocessors.
  implementation: >-
    Record exact route/region commitments and failover behavior. Restrict unapproved overflow rather than assuming
    the tenant hosting region determines model execution.
  required_settings_json: '{"processing_regions_allowlisted": true, "unapproved_region_fallback_allowed": false}'
  evidence_required_json: '["Feature-level data-location map, subprocessor locations and regional fallback/overflow
    decision."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    Capacity overflow sends prompts to an unapproved region.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-011
  name: Deletion, revocation and derived-data lifecycle
  domain: Data lifecycle and privacy
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Propagate deletion and access revocation to derived copies, caches, embeddings, memories and outputs subject to
    lawful retention.
  implementation: >-
    Define verified deletion windows and known backup/legal-hold limits; test source removal and entitlement changes
    against retrieval.
  required_settings_json: '{"derived_data_deletion_process_defined": true, "revoked_sources_remain_retrievable": false}'
  evidence_required_json: '["Deletion/revocation test plus vendor backup, recovery and legal-hold limitations."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An erased source remains visible through an embedding, agent memory or saved summary.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-012
  name: Tenant, user and session isolation
  domain: Data protection
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Maintain tenant, user and session isolation in AI processing, caches, histories and vector/search stores.
  implementation: >-
    Test cross-user/context leakage and obtain vendor evidence for model-serving and storage separation. Conversation
    identifiers are not an authorization control.
  required_settings_json: '{"cross_tenant_context_reuse_allowed": false, "shared_user_conversation_memory_allowed":
    false}'
  evidence_required_json: '["Tenant-isolation assurance and cross-user/session adversarial tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    One user receives grounded data from another user through reused history or cache.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-DAT-013
  name: Vendor support and human access
  domain: Third-party assurance
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Constrain human vendor/subprocessor access to AI data to documented, authorized and audited purposes.
  implementation: >-
    Review support access, emergency access, diagnostics, human moderation and customer approval requirements. Ensure
    restricted data cannot leak through support uploads.
  required_settings_json: '{}'
  evidence_required_json: '["Support-access controls, access-event availability and contractual human-access terms."]'
  validation_mode: manual_evidence
  negative_scenario: >-
    Troubleshooting exposes production prompts to an unapproved support team or location.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-NET-001
  name: SaaS network and access boundary
  domain: Network and integration security
  severity: high
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Secure approved SaaS access routes without imposing customer-managed AKS/private-endpoint requirements on vendor
    infrastructure.
  implementation: >-
    Use approved domains, transport, session controls and available tenant IP/network restrictions. Require private
    connectivity only where policy requires it and the specific route supports it.
  required_settings_json: '{"unapproved_ai_endpoints_allowed": false, "customer_network_controls_bypassed": false}'
  evidence_required_json: '["Approved endpoint inventory and connectivity decision for browser, API and connector
    paths."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A browser, API or alternate model route sends content to an unapproved endpoint.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-NET-002
  name: External destinations and exfiltration prevention
  domain: Network and integration security
  severity: critical
  responsibility: shared
  applies_when_json: '["external_connectors", "agents", "write_actions"]'
  requirement: >-
    Constrain outbound tool, webhook, fetch, email and export destinations to explicit business-approved allowlists.
  implementation: >-
    Validate resolved destinations and redirects; prevent attacker-chosen URLs, server-side request forgery and bulk
    export via AI-generated parameters.
  required_settings_json: '{"external_destinations_allowlisted": true, "model_selected_arbitrary_destinations_allowed":
    false}'
  evidence_required_json: '["Tool destination controls and rejected arbitrary-URL/redirect/export tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An injected instruction causes an agent to send record data to an attacker-controlled URL.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-NET-003
  name: Credentials, tokens and secret references
  domain: Cryptography and secrets
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Keep secrets in approved credential stores; scope, rotate and revoke integration credentials without placing values
    in YAML or prompts.
  implementation: >-
    Use approved OAuth/service auth, restrict audiences/scopes and separate environments; avoid credential passthrough
    or shared administrator tokens.
  required_settings_json: '{"inline_credentials_allowed": false, "integration_credentials_scoped": true, "credential_rotation_and_revocation_defined":
    true}'
  evidence_required_json: '["Credential-reference inventory, redacted scope export and revocation test; never attach
    secret values."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An agent action uses a long-lived administrator token embedded in its prompt or script.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-NET-004
  name: API, webhook and tool input validation
  domain: Network and integration security
  severity: critical
  responsibility: shared
  applies_when_json: '["external_connectors", "write_actions", "custom_code"]'
  requirement: >-
    Authenticate inbound integrations and validate parameters, payloads and replay/idempotency controls for side effects.
  implementation: >-
    Enforce typed tool schemas and action allowlists. Validate webhook signatures or equivalent authenticated transport
    and reject unsafe generated query/code fragments.
  required_settings_json: '{"tool_parameters_validated": true, "side_effect_replay_protection_required": true}'
  evidence_required_json: '["API/tool contracts, authentication configuration and rejected malformed/replayed-action
    tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    An AI-generated identifier or replayed callback updates an unauthorized record.
  supports_baseline_json: '[]'
  source_refs_json: '[]'
- id: SAAS-AI-001
  name: Feature-level AI protection coverage
  domain: AI security
  severity: critical
  responsibility: shared
  applies_when_json: '["always"]'
  requirement: >-
    Identify effective input, output, retrieval and tool safeguards for each enabled feature and route; a product-wide
    trust label is insufficient.
  implementation: >-
    Map native protections to required outcomes, record unsupported surfaces and prevent unreviewed direct model calls
    or bypass routes.
  required_settings_json: '{"input_protection_coverage_documented": true, "output_protection_coverage_documented":
    true, "unreviewed_guardrail_bypass_allowed": false}'
  evidence_required_json: '["Per-feature protection matrix and request/response/custom-route tests."]'
  validation_mode: declared_settings_and_evidence
  negative_scenario: >-
    A custom skill lacks output filtering while the review claims universal Trust Layer coverage.
